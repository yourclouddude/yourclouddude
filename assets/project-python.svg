<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-labelledby="title desc"><title id="title">Safe file organizer</title><desc id="desc">Useful automation starts with a plan.</desc><style>text{font-family:Consolas,"Liberation Mono",monospace} .packet{animation:travel 7s linear infinite}.blink{animation:blink 3s steps(1) infinite}.float{animation:float 9s ease-in-out infinite}@keyframes travel{0%{stroke-dashoffset:128}100%{stroke-dashoffset:0}}@keyframes blink{0%,80%,100%{opacity:1}90%{opacity:.3}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){.packet,.blink,.float{animation:none}}</style><rect x="0" y="0" width="560" height="240" fill="#0d1b2e" /><rect x="4" y="4" width="552" height="232" fill="#152840" /><rect x="24" y="26" width="5" height="29" fill="#94dfc4" /><text x="43" y="48" font-size="26" fill="#edf8fc" >Safe file organizer</text><text x="26" y="78" font-size="16" fill="#b2c9dd" >Useful automation starts with a plan.</text><rect x="34" y="116" width="50" height="48" fill="#55728a" /><rect x="42" y="124" width="28" height="4" fill="#a2bed1" /><rect x="52" y="126" width="50" height="48" fill="#55728a" /><rect x="60" y="134" width="28" height="4" fill="#a2bed1" /><rect x="70" y="136" width="50" height="48" fill="#55728a" /><rect x="78" y="144" width="28" height="4" fill="#a2bed1" /><path d="M132 145H197 M347 145H405" fill="none" stroke="#719bb5" stroke-width="4"/><rect x="205" y="114" width="134" height="58" fill="#38566e" /><text x="225" y="149" font-size="20" fill="#94dfc4" >preview</text><path d="M422 113H449L457 122H516V174H422Z" fill="#94dfc4" /><rect x="433" y="137" width="72" height="6" fill="#536a5b" /><text x="28" y="212" font-size="18" fill="#94dfc4" >Plan / inspect / apply / undo</text></svg>
