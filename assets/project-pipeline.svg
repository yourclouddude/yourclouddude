<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-labelledby="title desc"><title id="title">Event-driven image pipeline</title><desc id="desc">Give unfinished work somewhere to wait.</desc><style>text{font-family:Consolas,"Liberation Mono",monospace} .packet{animation:travel 7s linear infinite}.blink{animation:blink 3s steps(1) infinite}.float{animation:float 9s ease-in-out infinite}@keyframes travel{0%{stroke-dashoffset:128}100%{stroke-dashoffset:0}}@keyframes blink{0%,80%,100%{opacity:1}90%{opacity:.3}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){.packet,.blink,.float{animation:none}}</style><rect x="0" y="0" width="560" height="240" fill="#0d1b2e" /><rect x="4" y="4" width="552" height="232" fill="#152840" /><rect x="24" y="26" width="5" height="29" fill="#89d9eb" /><text x="43" y="48" font-size="26" fill="#edf8fc" >Event-driven image pipeline</text><text x="26" y="78" font-size="16" fill="#b2c9dd" >Give unfinished work somewhere to wait.</text><rect x="26" y="118" width="67" height="55" fill="#38566e" /><text x="40" y="152" font-size="22" fill="#89d9eb" >S3</text><rect x="136" y="129" width="23" height="29" fill="#89d9eb" /><rect x="141" y="135" width="13" height="3" fill="#375468" /><rect x="167" y="129" width="23" height="29" fill="#89d9eb" /><rect x="172" y="135" width="13" height="3" fill="#375468" /><rect x="198" y="129" width="23" height="29" fill="#89d9eb" /><rect x="203" y="135" width="13" height="3" fill="#375468" /><path d="M96 144H126 M230 144H280 M368 144H438" fill="none" stroke="#719bb5" stroke-width="4"/><rect x="285" y="118" width="80" height="55" fill="#38566e" /><text x="296" y="152" font-size="16" fill="#edf8fc" >worker</text><path d="M464 113L492 142L464 171L436 142Z" fill="#89d9eb" /><text x="458" y="150" font-size="24" fill="#0d1b2e" >✓</text><text x="28" y="212" font-size="18" fill="#89d9eb" >Buffer / retry / isolat