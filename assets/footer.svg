<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="title desc"><title id="title">See you in the next build — YourCloudDude</title><desc id="desc">Explore practical cloud projects and guides at yourclouddude.com.</desc><style>text{font-family:Consolas,"Liberation Mono",monospace} .packet{animation:travel 7s linear infinite}.blink{animation:blink 3s steps(1) infinite}.float{animation:float 9s ease-in-out infinite}@keyframes travel{0%{stroke-dashoffset:128}100%{stroke-dashoffset:0}}@keyframes blink{0%,80%,100%{opacity:1}90%{opacity:.3}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){.packet,.blink,.float{animation:none}}</style><rect x="0" y="0" width="1200" height="100" fill="#0d1b2e" /><rect x="6" y="6" width="1188" height="88" fill="#152840" /><g transform="translate(30 24) scale(0.65)" ><path d="M0 28H16V12H36V0H68V8H88V20H108V36H128V52H0Z" fill="#8dc3d6" /><rect x="16" y="52" width="96" height="8" fill="#719ab8" /></g><text x="145" y="46" font-size="26" fill="#edf8fc" >See you in the next build.</text><text x="146" y="76" font-size="18" fill="#89d9eb" >yourclouddude.com</text><text x="1037" y="59" font-size="34" fill="#ffc979" >&lt;/&gt;</text></svg>
