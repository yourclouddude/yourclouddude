<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="156" viewBox="0 0 1200 156" role="img" aria-labelledby="title desc"><title id="title">Tools on my workbench</title><desc id="desc">AWS: Lambda, S3, SQS. Python: CLI, APIs, pytest. Terraform: VPC, EC2, RDS. Delivery: SAM, Git and GitHub Actions.</desc><style>text{font-family:Consolas,"Liberation Mono",monospace} .packet{animation:travel 7s linear infinite}.blink{animation:blink 3s steps(1) infinite}.float{animation:float 9s ease-in-out infinite}@keyframes travel{0%{stroke-dashoffset:128}100%{stroke-dashoffset:0}}@keyframes blink{0%,80%,100%{opacity:1}90%{opacity:.3}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){.packet,.blink,.float{animation:none}}</style><rect x="0" y="0" width="1200" height="156" fill="#0d1b2e" /><rect x="6" y="6" width="1188" height="144" fill="#152840" /><rect x="24" y="26" width="36" height="32" fill="#344e69" /><text x="32" y="49" font-size="18" fill="#ffc979" >λ</text><text x="72" y="50" font-size="23" fill="#edf8fc" >AWS</text><text x="24" y="102" font-size="17" fill="#b2c9dd" >Lambda / S3 / SQS</text><rect x="24" y="124" width="258" height="3" fill="#ffc979" /><rect x="320" y="26" width="36" height="32" fill="#344e69" /><text x="328" y="49" font-size="18" fill="#94dfc4" >Py</text><text x="368" y="50" font-size="23" fill="#edf8fc" >Python</text><text x="320" y="102" font-size="17" fill="#b2c9dd" >CLI / APIs / pytest</text><rect x="320" y="124" width="258" height="3" fill="#94dfc4" /><rect x="616" y="26" width="36" height="32" fill="#344e69" /><text x="624" y="49" font-size="18" fill="#bdabef" >{}</text><text x="664" y="50" font-size="23" fill="#edf8fc" >Terraform</text><text x="616" y="102" font-size="17" fill="#b2c9dd" >VPC / EC2 / RDS</text><rect x="616" y="124" width="258" height="3" fill="#bdabef" /><rect x="912" y="26" width="36" height="32" fill="#344e69" /><text x="920" y="49" font-size="18" fill="#89d9