<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="156" viewBox="0 0 1200 156" role="img" aria-labelledby="title desc"><title id="title">Tools on my workbench</title><desc id="desc">AWS: Lambda, S3, SQS. Python: CLI, APIs, pytest. Terraform: VPC, EC2, RDS. Delivery: SAM, Git and GitHub Actions.</desc><style>text{font-family:Consolas,"Liberation Mono",monospace}
    .packet{animation:travel 2.8s ease-in-out infinite}
    .cloud-drift{animation:cloud-drift 12s steps(12) infinite}
    .robot-idle{animation:robot-idle 3.2s steps(2) infinite}
    .robot-head{animation:robot-head 6.4s steps(2) infinite}
    .robot-eyes{transform-origin:28px 31px;animation:robot-eyes 4.8s steps(1) infinite}
    .robot-arm{transform-origin:52px 60px;animation:robot-arm 6.4s steps(3) infinite}
    .server-led{animation:server-led 2.4s steps(1) infinite}
    .server-scan{animation:server-scan 3.6s steps(12) infinite}
    .terminal-cursor{animation:cursor 1.2s steps(1) infinite}
    .terminal-progress{transform-origin:14px 29px;animation:progress 4.8s steps(8) infinite}
    .steam{animation:steam 3.2s steps(4) infinite}
    .queue-job{animation:queue-job 2.4s steps(6) infinite}
    .node-active{animation:node-active 4.8s steps(1) infinite}
    .file-transfer{animation:file-transfer 4.8s steps(10) infinite}
    .file-lift{animation:file-lift 4.8s steps(3) infinite}
    .tool-scan{transform-box:fill-box;transform-origin:left;animation:tool-scan 6.4s steps(12) infinite}
    @keyframes travel{from{stroke-dashoffset:128}to{stroke-dashoffset:0}}
    @keyframes cloud-drift{0%,100%{transform:translate(-12px,0)}50%{transform:translate(16px,-8px)}}
    @keyframes robot-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes robot-head{0%,35%,100%{transform:translateX(0)}45%,70%{transform:translateX(4px)}}
    @keyframes robot-eyes{0%,40%,46%,100%{transform:scaleY(1)}42%,44%{transform:scaleY(.18)}}
    @keyframes robot-arm{0%,22%,82%,100%{transform:rotate(0)}32%,52%,72%{transform:rotate(-135deg)}42%,62%{transform:rotate(-95deg)}}
    @keyframes server-led{0%,25%,65%,100%{opacity:1}15%,45%,75%{opacity:.18}}
    @keyframes server-scan{0%{transform:translateY(0);opacity:0}12%{opacity:.7}85%{opacity:.7}100%{transform:translateY(80px);opacity:0}}
    @keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes progress{0%,12%{transform:scaleX(.05)}65%,85%{transform:scaleX(1)}100%{transform:scaleX(.05)}}
    @keyframes steam{0%{transform:translate(0,4px);opacity:0}25%{opacity:.8}75%{opacity:.5}100%{transform:translate(4px,-18px);opacity:0}}
    @keyframes queue-job{0%{transform:translateX(-10px);opacity:0}20%,70%{opacity:1}100%{transform:translateX(24px);opacity:0}}
    @keyframes node-active{0%,55%,100%{opacity:0}12%,40%{opacity:1}}
    @keyframes file-transfer{0%,12%{transform:translateX(0);opacity:0}20%{opacity:1}70%{transform:translateX(62px);opacity:1}85%,100%{transform:translateX(62px);opacity:0}}
    @keyframes file-lift{0%,20%,75%,100%{transform:translateY(0)}35%,60%{transform:translateY(-10px)}}
    @keyframes tool-scan{0%,100%{transform:scaleX(.08);opacity:.5}45%,65%{transform:scaleX(1);opacity:1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style><rect x="0" y="0" width="1200" height="156" fill="#0d1b2e" /><rect x="6" y="6" width="1188" height="144" fill="#152840" /><rect x="24" y="26" width="36" height="32" fill="#344e69" /><text x="32" y="49" font-size="18" fill="#ffc979" >λ</text><text x="72" y="50" font-size="23" fill="#edf8fc" >AWS</text><text x="24" y="102" font-size="17" fill="#b2c9dd" >Lambda / S3 / SQS</text><rect x="24" y="124" width="258" height="3" fill="#344e69" /><g class="tool-scan" style="animation-delay:0.0s"><rect x="24" y="124" width="258" height="3" fill="#ffc979" /></g><rect x="320" y="26" width="36" height="32" fill="#344e69" /><text x="328" y="49" font-size="18" fill="#94dfc4" >Py</text><text x="368" y="50" font-size="23" fill="#edf8fc" >Python</text><text x="320" y="102" font-size="17" fill="#b2c9dd" >CLI / APIs / pytest</text><rect x="320" y="124" width="258" height="3" fill="#344e69" /><g class="tool-scan" style="animation-delay:-1.6s"><rect x="320" y="124" width="258" height="3" fill="#94dfc4" /></g><rect x="616" y="26" width="36" height="32" fill="#344e69" /><text x="624" y="49" font-size="18" fill="#bdabef" >{}</text><text x="664" y="50" font-size="23" fill="#edf8fc" >Terraform</text><text x="616" y="102" font-size="17" fill="#b2c9dd" >VPC / EC2 / RDS</text><rect x="616" y="124" width="258" height="3" fill="#344e69" /><g class="tool-scan" style="animation-delay:-3.2s"><rect x="616" y="124" width="258" height="3" fill="#bdabef" /></g><rect x="912" y="26" width="36" height="32" fill="#344e69" /><text x="920" y="49" font-size="18" fill="#89d9eb" >&gt;_</text><text x="960" y="50" font-size="23" fill="#edf8fc" >Delivery</text><text x="912" y="102" font-size="17" fill="#b2c9dd" >SAM / Git / Actions</text><rect x="912" y="124" width="258" height="3" fill="#344e69" /><g class="tool-scan" style="animation-delay:-4.800000000000001s"><rect x="912" y="124" width="258" height="3" fill="#89d9eb" /></g></svg>
