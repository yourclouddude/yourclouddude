<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-labelledby="title desc"><title id="title">Serverless URL shortener</title><desc id="desc">A small API with real design decisions.</desc><style>text{font-family:Consolas,"Liberation Mono",monospace} .packet{animation:travel 7s linear infinite}.blink{animation:blink 3s steps(1) infinite}.float{animation:float 9s ease-in-out infinite}@keyframes travel{0%{stroke-dashoffset:128}100%{stroke-dashoffset:0}}@keyframes blink{0%,80%,100%{opacity:1}90%{opacity:.3}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){.packet,.blink,.float{animation:none}}</style><rect x="0" y="0" width="560" height="240" fill="#0d1b2e" /><rect x="4" y="4" width="552" height="232" fill="#152840" /><rect x="24" y="26" width="5" height="29" fill="#ffc979" /><text x="43" y="48" font-size="26" fill="#edf8fc" >Serverless URL shortener</text><text x="26" y="78" font-size="16" fill="#b2c9dd" >A small API with real design decisions.</text><rect x="30" y="114" width="122" height="58" fill="#284762" /><rect x="38" y="106" width="106" height="8" fill="#ffc979" /><text x="91" y="149" font-size="17" fill="#edf8fc" text-anchor="middle">HTTP</text><rect x="217" y="114" width="122" height="58" fill="#284762" /><rect x="225" y="106" width="106" height="8" fill="#ffc979" /><text x="278" y="149" font-size="17" fill="#edf8fc" text-anchor="middle">Lambda</text><rect x="408" y="114" width="122" height="58" fill="#284762" /><rect x="416" y="106" width="106" height="8" fill="#ffc979" /><text x="469" y="149" font-size="17" fill="#edf8fc" text-anchor="middle">DynamoDB</text><path d="M154 141H215 M341 141H406" fill="none" stroke="#719bb5" stroke-width="4"/><path d="M154 141H215 M341 141H406" fill="none" stroke="#ffc979" stroke-width="4" stroke-dasharray="8 120" class="packet"/><text x="28" y="212" font-size="18" fill="#ffc979" >Collisions / expiration / IAM</text></svg>
