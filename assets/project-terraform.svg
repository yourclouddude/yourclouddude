<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-labelledby="title desc"><title id="title">Three-tier AWS stack</title><desc id="desc">Decide what can talk to what.</desc><style>text{font-family:Consolas,"Liberation Mono",monospace} .packet{animation:travel 7s linear infinite}.blink{animation:blink 3s steps(1) infinite}.float{animation:float 9s ease-in-out infinite}@keyframes travel{0%{stroke-dashoffset:128}100%{stroke-dashoffset:0}}@keyframes blink{0%,80%,100%{opacity:1}90%{opacity:.3}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){.packet,.blink,.float{animation:none}}</style><rect x="0" y="0" width="560" height="240" fill="#0d1b2e" /><rect x="4" y="4" width="552" height="232" fill="#152840" /><rect x="24" y="26" width="5" height="29" fill="#bdabef" /><text x="43" y="48" font-size="26" fill="#edf8fc" >Three-tier AWS stack</text><text x="26" y="78" font-size="16" fill="#b2c9dd" >Decide what can talk to what.</text><rect x="25" y="102" width="510" height="82" fill="#263952" stroke="#9c8abf" stroke-width="2" stroke-dasharray="6 5"/><rect x="42" y="120" width="126" height="44" fill="#40506a" /><text x="105" y="148" font-size="19" fill="#edf8fc" text-anchor="middle">ALB</text><rect x="216" y="120" width="126" height="44" fill="#40506a" /><text x="279" y="148" font-size="19" fill="#edf8fc" text-anchor="middle">EC2</text><rect x="390" y="120" width="126" height="44" fill="#40506a" /><text x="453" y="148" font-size="19" fill="#edf8fc" text-anchor="middle">RDS</text><path d="M170 142H212 M346 142H386" fill="none" stroke="#bdabef" stroke-width="4"/><text x="28" y="212" font-size="18" fill="#bdabef" >Public entry / private app + data</text></svg>
